<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Los del Disc</title>

    <link rel="icon" type="image/png" href="imagenes/Logo Pagina Web.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@7.7.8/dist/js-dos.css">
</head>


<body>

    <div id="appHeader"></div>

    <main class="contenedor-principal">

        <div id="appSidebar"></div>

        <section id="appContenido" class="seccion-muro">

            <div class="cargando-pagina">
                <p>Cargando Los del Disc...</p>
            </div>

        </section>

    </main>
    <div id="popupAnuncio" class="popup-anuncio oculto">

        <div class="popup-contenido">

            <div class="popup-top">

                <span class="popup-badge">
                    📢 Nuevo Anuncio
                </span>

                <button id="btnCerrarPopupX" class="popup-btn-x" type="button">
                    &times;
                </button>

            </div>


            <h4 id="popupTitulo">
                Título del Anuncio
            </h4>


            <p id="popupResumen">
                Cargando detalles...
            </p>


            <div class="popup-botones">

                <button id="btnDescartarAnuncio" class="btn-popup-secundario" type="button">
                    Descartar
                </button>


                <button id="btnIrAnuncio" class="btn-popup-primario" type="button">
                    Ir al Anuncio →
                </button>

            </div>

        </div>

    </div>
    <script src="https://js-dos.com/cdn/js-dos-api.js"></script>
    <script type="module" src="js/app.js"></script>

</body>

</html>
