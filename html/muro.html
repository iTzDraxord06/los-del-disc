<div class="columna-feed-global">

    <div class="caja-crear-post">

        <h3>
            💬 Tablón de la Comunidad
        </h3>


        <form id="formPostGlobal" class="form-comentario">

            <div id="bannerRespuestaGlobal" class="banner-respondiendo oculto">

                <span>

                    Respondiendo a

                    <strong id="textoRespondiendoGlobal">
                        @Usuario
                    </strong>

                </span>


                <button type="button" id="btnCancelarRespuestaGlobal" title="Cancelar">
                    ✕ Cancelar
                </button>

            </div>

            <textarea id="inputPostGlobal" placeholder="¿Qué está pasando en el server? Escribe algo para todos..."
                maxlength="600"></textarea>

            <div class="barra-adjuntos-comentario">

                <div class="grupo-adjunto">

                    <label for="inputFotoPostGlobal" class="btn-secundario btn-adjunto">
                        📷
                        <span>
                            Subir foto
                        </span>
                    </label>


                    <input type="file" id="inputFotoPostGlobal" accept="image/*" class="oculto">


                    <span id="labelFotoPostGlobal" class="nombre-foto-adjunta oculto"></span>


                    <button type="button" id="btnQuitarFotoPostGlobal" class="btn-close oculto">
                        &times;
                    </button>

                </div>

                <div class="input-grupo-media">

                    <label for="inputVideoPostGlobal" class="btn-secundario lbl-video-trigger">
                        🎥 Video (Drive)
                    </label>


                    <input type="file" id="inputVideoPostGlobal" accept="video/mp4,video/webm"
                        class="input-video-media-file oculto">


                    <span class="nombre-archivo-video"></span>

                </div>

                <button type="submit" id="btnEnviarPostGlobal" class="btn-primary">
                    Publicar
                </button>

            </div>

        </form>

    </div>

    <div id="feedGlobalPosts" class="lista-comentarios feed-global">

        <p class="cargando">
            Cargando publicaciones...
        </p>

    </div>

</div>

<div id="modalVisor" class="modal-visor oculto">

    <span id="btnCerrarVisor" class="btn-cerrar-visor" title="Cerrar">
        &times;
    </span>


    <img id="imagenVisorAmpliada" src="" alt="Vista previa ampliada">

</div>
